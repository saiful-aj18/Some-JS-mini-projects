<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>Simple Calculator</title>
</head>
<body class="bg-gray-900 flex items-center justify-center min-h-screen">
    <div class="bg-gray-800 p-6 rounded-2xl shadow-xl w-80">
        <!-- Display -->
        <input 
        id="display"
        class="w-full mb-4 p-4 text-right text-2xl bg-gray-700 text-white rounded-lg outline-none"
        disabled
        type="text">

        <div class="grid grid-cols-4 gap-3 text-white">

            <!-- Row 1 -->
            <button class="bg-red-500 cursor-pointer" onclick="clearDisplay()">C</button>
            <button class="bg-yellow-500 cursor-pointer" onclick="deleteLast()">DEL</button>
            <button class="bg-orange-500 cursor-pointer" onclick="appendValue('%')">%</button>
            <button class="bg-purple-500 cursor-pointer" onclick="appendValue('÷')">÷</button>
            <!-- Row 1 End -->


            <!-- Row 2 -->
            <button class="bg-gray-500 cursor-pointer"  onclick="appendValue('7')">7</button>
            <button class="bg-gray-500 cursor-pointer"  onclick="appendValue('8')">8</button>
            <button class="bg-gray-500 cursor-pointer"  onclick="appendValue('9')">9</button>
            <button class="bg-blue-500 cursor-pointer"  onclick="appendValue('x')">x</button>
            <!-- Row 2 End -->

            <!-- Row 3 -->
            <button class="bg-gray-500 cursor-pointer"  onclick="appendValue('4')">4</button>
            <button class="bg-gray-500 cursor-pointer"  onclick="appendValue('5')">5</button>
            <button class="bg-gray-500 cursor-pointer"  onclick="appendValue('6')">6</button>
            <button class="bg-blue-500 cursor-pointer"  onclick="appendValue('-')">-</button>
            <!-- Row 3 End -->

            <!-- Row 4 -->
            <button class="bg-gray-500 cursor-pointer"  onclick="appendValue('1')">1</button>
            <button class="bg-gray-500 cursor-pointer"  onclick="appendValue('2')">2</button>
            <button class="bg-gray-500 cursor-pointer"  onclick="appendValue('3')">3</button>
            <button class="bg-blue-500 cursor-pointer"  onclick="appendValue('+')">+</button>
            <!-- Row 4 End -->

            <!-- Row 5 -->
            <button class="bg-gray-500 cursor-pointer"  onclick="appendValue('0')">0</button>
            <button class="bg-gray-500 cursor-pointer"  onclick="appendValue('.')">.</button>
            <button class="bg-gray-500 cursor-pointer col-span-2"  onclick="calculate()">=</button>
            <!-- Row 5 End -->

        </div>
    </div>

    <script>
        const display = document.getElementById("display");


        function clearDisplay() {
            display.value = ""
        }

        function deleteLast() {
            display.value = display.value.slice(0,-1)
        }

        function appendValue(value) {
            display.value = display.value + value;
        }

        function calculate(){
            try {
                let expression = display.value.replace(/x/g, "*").replace(/÷/g, "/"
                )
                display.value = eval(expression);
            } catch (error) {
                console.log(error)
                display.value = error.message || "Math Error";
            }
        }


    </script>
</body>
</html>
